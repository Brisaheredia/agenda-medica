spring:
  application:
    name: agenda-medica-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/agenda_medica?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: America/Argentina/Buenos_Aires

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:agenda-medica-dev-secret-change-me-2026-super-seguro-1234567890}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
