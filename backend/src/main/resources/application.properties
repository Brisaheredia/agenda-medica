spring.application.name=agenda-medica-backend

# Base local documentada por el proyecto. DB_URL puede reemplazarla.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agenda_medica?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.jackson.time-zone=America/Argentina/Buenos_Aires

server.port=${SERVER_PORT:8080}
springdoc.swagger-ui.path=/swagger-ui.html

# No se incluye una clave fija: JWT_SECRET debe estar configurada en IntelliJ.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
